# Receita de CI/CD da Loja (S-0260) -- lida pela Tilt, nunca escrita por IA.
# Etapas sem `depende_de` comecam JUNTAS, em maquinas diferentes.
# `titulo` e `descricao` sao o que a tela mostra -- o nome e o identificador.

[cartucho]
id     = "demo-loja"
nome   = "Loja -- backend Rust, frontend TypeScript"
versao = "1.0.0"
modo   = "pipeline"

[mapreduce]
split  = { tipo = "none" }
reduce = { tipo = "manifest" }

[recursos]
memory_max_mb = 2048
deadline_secs = 1800

[entrada]
extensoes         = [".toml"]
max_arquivos      = 1
max_arquivo_bytes = 1048576
max_lote_bytes    = 1048576

[[pipeline.etapa]]
nome       = "build-backend"
titulo     = "Compilar o backend (Rust)"
descricao  = "Constrói a imagem da API da loja com cargo, em dois estágios."
tool       = "container"
acao       = "build"
dockerfile = "backend/Dockerfile"
contexto   = "backend"

[[pipeline.etapa]]
nome       = "build-frontend"
titulo     = "Montar o frontend (TypeScript)"
descricao  = "Gera o bundle do carrinho e a imagem Node que o serve."
tool       = "container"
acao       = "build"
dockerfile = "frontend/Dockerfile"
contexto   = "frontend"

[[pipeline.etapa]]
nome       = "teste-backend"
titulo     = "Testar a API"
descricao  = "Roda o auto-teste da API dentro da imagem recém-construída."
depende_de = ["build-backend"]
tool       = "container"
acao       = "run"
imagem_de  = "build-backend"
comando    = ["/app/loja-api", "--auto-teste"]

[[pipeline.etapa]]
nome       = "teste-frontend"
titulo     = "Testar o carrinho"
descricao  = "Executa os testes do carrinho de compras na imagem do frontend."
depende_de = ["build-frontend"]
tool       = "container"
acao       = "run"
imagem_de  = "build-frontend"
comando    = ["node", "/app/testes.mjs"]

[[pipeline.etapa]]
nome       = "publicar"
titulo     = "Publicar a loja"
descricao  = "Sobe a loja numa máquina da grade e confere se responde."
depende_de = ["teste-backend", "teste-frontend"]
tool       = "container"
acao       = "serve"
imagem_de  = "build-frontend"
porta      = 80
saude      = "/"
destino    = "grade"
estrategia = "substituir"
